name: build-debian

on:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        busybox: [ "1.36.1", "1.37.0", "1.38.0" ]
        debian: [ "12.15", "13.7" ]
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v7
      -
        name: Read image version
        uses: bfren/read-file@v2
        with:
          file: ./VERSION
        id: version
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to Quay.io Container Registry
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.QUAY_TOKEN }}
      -
        name: Set default Alpine branch for patches
        shell: bash
        run: |
          echo "ALPINE_BRANCH=3.20-stable" >> $GITHUB_ENV
      -
        name: Override for specific Busybox versions
        shell: bash
        if: matrix.busybox == '1.37.0'
        run: |
          echo "ALPINE_BRANCH=3.24-stable" >> $GITHUB_ENV
      -
        name: Override for specific Busybox versions
        shell: bash
        if: matrix.busybox == '1.38.0'
        run: |
          echo "ALPINE_BRANCH=master" >> $GITHUB_ENV
      -
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile.debian
          build-args: |
            ALPINE_BRANCH=${{ env.ALPINE_BRANCH }}
            BUSYBOX=${{ matrix.busybox }}
            DEBIAN=${{ matrix.debian }}
          push: true
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          tags: |
            quay.io/bfren/busybox:${{ matrix.busybox }}-debian${{ matrix.debian }}-${{ steps.version.outputs.contents }}
      -
        name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
