name: build-debian

on:
  workflow_dispatch:

env:
  IMAGE: quay.io/bfren-bin/busybox

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        debian: [ "12.15", "13.7" ]
        busybox: [ "1.36.1", "1.37.0", "1.38.0" ]
        platform: [ "linux/amd64", "linux/arm64", "linux/arm/v7" ]
        include:
          -
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          -
            # GitHub's arm runners cannot run 32-bit arm code, so arm/v7 is built using QEMU
            platform: linux/arm/v7
            qemu: true
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to Quay.io Container Registry
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.QUAY_TOKEN }}
      -
        name: Build and push by digest
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile.debian
          build-args: |
            DEBIAN=${{ matrix.debian }}
            BUSYBOX=${{ matrix.busybox }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ env.IMAGE }}",push-by-digest=true,name-canonical=true,push=true
      -
        name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.docker_build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      -
        name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.busybox }}-debian${{ matrix.debian }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # run even if other combinations failed - each image is only created if all its platforms built
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        debian: [ "12.15", "13.7" ]
        busybox: [ "1.36.1", "1.37.0", "1.38.0" ]
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v7
      -
        name: Read image version
        uses: bfren/read-file@v2
        with:
          file: ./VERSION
        id: version
      -
        name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.busybox }}-debian${{ matrix.debian }}-*
          merge-multiple: true
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to Quay.io Container Registry
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.QUAY_TOKEN }}
      -
        name: Create multi-platform image and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          count=$(ls | wc -l)
          [ "${count}" -eq 3 ] || { echo "Expected 3 platform digests, found ${count} - not creating the image" ; exit 1 ; }
          tag=${IMAGE}:${{ matrix.busybox }}-debian${{ matrix.debian }}-${{ steps.version.outputs.contents }}
          docker buildx imagetools create -t ${tag} $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect ${tag}
        shell: bash
