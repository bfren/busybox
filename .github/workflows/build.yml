name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:

# one run per branch at a time - a newer push cancels the older run, so it cannot finish last and overwrite the
# newer images
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        busybox: [ "1.36.1", "1.37.0", "1.38.0" ]
    uses: bfren/docker/.github/workflows/build-bin.yml@main
    with:
      image: busybox
      build-args: |
        BUSYBOX=${{ matrix.busybox }}
      tags: |
        ${{ matrix.busybox }}-${VERSION}
    secrets:
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
